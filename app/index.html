<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP 保持收紧：script-src 只允许自身源，不放行 blob:。
      重采样 worklet 是从 public/ 按同源脚本加载的真实文件（见 src/audio/capture.ts），
      所以无需为它开口子 —— 早先用 Blob URL 时不得不开，实测那样会被这里直接拦掉。
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>VoicePilot</title>
    <style>
      /* 悬浮条是透明无边框窗口，背景必须由页面自己画。
         这里先给一个极简占位样式，等 M2 再做真正的 UI。 */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1f2937;
        -webkit-font-smoothing: antialiased;
      }
      #root { height: 100%; }

      /* 悬浮条文本区的细滚动条。Electron 是 Chromium，只认 -webkit- 前缀，
         不写的话默认滚动条在 148px 的小窗里又宽又丑。
         亮色主题下用深色滑块，白色滑块在浅底上会看不见 */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(15, 23, 42, 0.16);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(15, 23, 42, 0.30); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
